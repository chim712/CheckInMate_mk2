<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>출석 인증 키오스크</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- CSS 연결 -->
  <link rel="stylesheet" href="/static/css/kiosk_main.css" />
</head>
<body>
  <div class="kiosk-shell">
    <div class="kiosk-frame">
      <!-- 좌측 영역 -->
      <div class="left-panel">
        <!-- 로고 + 텍스트 -->
        <div class="logo-area">
          <div class="logo-wrap">
            <img src="/static/logo.png" alt="로고"
                 onerror="this.style.display='none'; this.parentElement.querySelector('.logo-placeholder').style.display='block';" />
            <span class="logo-placeholder" style="display:none;">LOGO</span>
          </div>
          <div class="logo-texts">
            <div class="logo-main">ATTENDANCE KIOSK</div>
            <div class="logo-sub">출석 인증 · 학생용 ID 입력</div>
          </div>
        </div>

        <!-- 시계 -->
        <div class="clock-area">
          <div id="clockDate" class="clock-date">0000-00-00 (요일)</div>
          <div id="clockTime" class="clock-time">00:00:00</div>
        </div>

        <!-- 아이디 입력부 -->
        <div class="id-display-wrapper">
          <div class="id-field">
            <div class="id-label">STUDENT ID</div>
            <div class="id-input-row">
              <span id="idValue" class="id-value placeholder">
                아이디를 입력하세요
              </span>
            </div>
          </div>
        </div>

        <!-- 등록 버튼 -->
        <div class="submit-area">
          <button id="submitBtn" class="primary-btn">등록</button>
        </div>
      </div>

      <!-- 우측 키패드 -->
      <div class="right-panel">
        <div class="keypad-card">
          <div class="keypad-title">(C) 2025 Chang-Hwan Im</div>
          <div class="keypad-grid">
            <button class="key-btn" data-key="1">1</button>
            <button class="key-btn" data-key="2">2</button>
            <button class="key-btn" data-key="3">3</button>
            <button class="key-btn" data-key="4">4</button>
            <button class="key-btn" data-key="5">5</button>
            <button class="key-btn" data-key="6">6</button>
            <button class="key-btn" data-key="7">7</button>
            <button class="key-btn" data-key="8">8</button>
            <button class="key-btn" data-key="9">9</button>

            <button class="key-btn key-blank" tabindex="-1" aria-hidden="true"></button>
            <button class="key-btn" data-key="0">0</button>
            <button class="key-btn key-clear" data-action="clear">지움</button>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- JS 연결 -->
  <script src="/static/js/kiosk_main.js"></script>
</body>
</html>
