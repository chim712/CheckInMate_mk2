<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>CheckInMate Kiosk</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    :root {
      --bg: #f5f7fb;
      --panel: #ffffff;
      --accent: #0f6bdc;
      --accent-soft: #e3f0ff;
      --text-main: #111827;
      --text-muted: #6b7280;
      --danger: #dc2626;
      --radius-xl: 24px;
      --shadow-soft: 0 10px 30px rgba(15, 23, 42, 0.12);
      --font-main: system-ui, -apple-system, BlinkMacSystemFont, "Noto Sans KR", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--font-main);
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 전체 컨테이너 */
    .kiosk-root {
      width: 100%;
      max-width: 1280px;
      height: 720px;
      max-height: 90vh;
      background: var(--panel);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-soft);
      padding: 28px 32px;
      display: grid;
      grid-template-columns: 1.4fr 1fr;
      gap: 24px;
      font-size: clamp(14px, 1.1vw, 18px);
    }

    .kiosk-left {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    /* 로고 */
    .kiosk-logo-area {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 12px;
    }

    .kiosk-logo-box {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      background: var(--accent-soft);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 22px;
      color: var(--accent);
      flex-shrink: 0;
    }

    .kiosk-logo-text-main {
      font-size: 26px;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.15;
    }

    .kiosk-logo-text-sub {
      font-size: 12px;
      color: var(--text-muted);
    }

    /* 시계: 날짜 블록(좌) + 시간 블록(우) */
    .kiosk-clock-wrap {
      margin: 8px 0 24px;
      display: flex;
      align-items: baseline;      /* 날짜와 시간의 기준선 맞춤 */
      gap: 24px;
    }

    .kiosk-date-block {
      display: flex;
      flex-direction: column;
      align-items: flex-start;    /* yyyy-mm-dd 기준으로 좌측 정렬 */
      gap: 2px;
    }

    .kiosk-date {
      font-size: clamp(18px, 2vw, 24px);
      font-weight: 500;
      color: var(--text-main);
      transform: translateY(-20px);
    }

    .kiosk-weekday {
      font-size: clamp(11px, 1.1vw, 13px);
      color: var(--accent);
      font-weight: 600;
      text-transform: capitalize;
      transform: translateY(-20px);
    }

    .kiosk-time-row {
      display: flex;
      align-items: baseline;      /* 시:분과 초의 기준선 맞춤 */
      gap: 6px;
    }

    .kiosk-time {
      font-size: clamp(40px, 5.5vw, 64px);
      font-weight: 600;
      letter-spacing: 2px;
      color: var(--text-main);
    }

    .kiosk-seconds {
      font-size: clamp(20px, 2.2vw, 28px);
      color: var(--text-muted);
      transform: translateY(3px);
    }

    /* 입력 영역 */
    .kiosk-input-label {
      font-size: 18px;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .kiosk-input-display {
      width: 100%;
      padding: 14px 12px;
      font-size: 28px;
      border: none;
      border-bottom: 2px solid var(--accent);
      outline: none;
      color: var(--text-main);
      background: transparent;
      letter-spacing: 4px;
    }

    .kiosk-input-display::placeholder {
      color: #d1d5db;
      letter-spacing: normal;
    }

    .kiosk-actions {
      display: flex;
      gap: 14px;
      margin-top: 18px;
    }

    .btn {
      border: none;
      padding: 12px 26px;
      border-radius: 999px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.08s ease, box-shadow 0.08s ease, background 0.12s;
      white-space: nowrap;
    }

    .btn:active {
      transform: translateY(1px);
      box-shadow: none;
    }

    .btn-erase {
      background: #e5e7eb;
      color: #111827;
    }

    .btn-erase:hover {
      background: #d1d5db;
    }

    .btn-submit {
      background: var(--accent);
      color: #ffffff;
      box-shadow: 0 6px 14px rgba(37, 99, 235, 0.35);
    }

    .btn-submit:hover {
      background: #0b5ac0;
    }

    .kiosk-message {
      margin-top: 10px;
      font-size: 14px;
      color: var(--danger);
      min-height: 18px;
    }

    .kiosk-spacer {
      flex: 1;
    }

    /* 키패드 */
    .kiosk-keypad-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .kiosk-keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(4, 1fr);
      gap: 14px;
      width: 100%;
      max-width: 360px;
      height: 100%;
      max-height: 520px;
    }

    .key {
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      background: var(--accent);
      color: #ffffff;
      font-size: 30px;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
      transition: transform 0.08s ease, box-shadow 0.08s ease, background 0.12s;
      box-shadow: 0 6px 16px rgba(15, 23, 42, 0.26);
    }

    .key:active {
      transform: translateY(2px);
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.2);
    }

    .key-zero {
      grid-column: 1 / 3;
    }

    .key-back {
      font-size: 24px;
      background: #111827;
    }

    .key-back:hover {
      opacity: 0.9;
    }

    @media (max-width: 900px) {
      .kiosk-root {
        grid-template-columns: 1fr;
        grid-template-rows: auto auto;
        height: auto;
      }
      .kiosk-keypad-wrap {
        justify-content: flex-start;
      }
      .kiosk-keypad {
        max-width: 100%;
        max-height: none;
      }
    }
  </style>
</head>
<body>
<div id="checkin-kiosk" class="kiosk-root">
  <!-- 좌측 -->
  <div class="kiosk-left">
    <!-- 로고 -->
    <div class="kiosk-logo-area">
      <div class="kiosk-logo-box">CM</div>
      <div>
        <div class="kiosk-logo-text-sub">Attendance Management System</div>
        <div class="kiosk-logo-text-main">CheckInMate</div>
      </div>
    </div>

    <!-- 시계: 날짜 블록 + 시간 블록 -->
    <div class="kiosk-clock-wrap">
      <div class="kiosk-date-block">
        <div id="kiosk-date" class="kiosk-date">0000-00-00</div>
        <div id="kiosk-weekday" class="kiosk-weekday">Wednesday</div>
      </div>
      <div class="kiosk-time-row">
        <span id="kiosk-time" class="kiosk-time">00:00</span>
        <span id="kiosk-seconds" class="kiosk-seconds">:00</span>
      </div>
    </div>

    <!-- ID 입력 -->
    <label class="kiosk-input-label" for="kiosk-id-input">Input Your ID</label>
    <input id="kiosk-id-input" class="kiosk-input-display" type="text"
           inputmode="numeric" placeholder="ID를 입력하세요"
           autocomplete="off" readonly />

    <div class="kiosk-actions">
      <button type="button" class="btn btn-erase" id="btn-erase">Erase</button>
      <button type="button" class="btn btn-submit" id="btn-submit">Submit</button>
    </div>

    <div id="kiosk-message" class="kiosk-message"></div>
    <div class="kiosk-spacer"></div>
  </div>

  <!-- 우측 키패드 -->
  <div class="kiosk-keypad-wrap">
    <div class="kiosk-keypad" id="kiosk-keypad">
      <div class="key" data-key="1">1</div>
      <div class="key" data-key="2">2</div>
      <div class="key" data-key="3">3</div>
      <div class="key" data-key="4">4</div>
      <div class="key" data-key="5">5</div>
      <div class="key" data-key="6">6</div>
      <div class="key" data-key="7">7</div>
      <div class="key" data-key="8">8</div>
      <div class="key" data-key="9">9</div>
      <div class="key key-zero" data-key="0">0</div>
      <div class="key key-back" data-key="back">←</div>
    </div>
  </div>
</div>

<script>
  // 시계
  (function initClock() {
    const elDate = document.getElementById("kiosk-date");
    const elWeek = document.getElementById("kiosk-weekday");
    const elTime = document.getElementById("kiosk-time");
    const elSec  = document.getElementById("kiosk-seconds");

    const weekNames = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];

    function tick() {
      const now = new Date();
      const yyyy = now.getFullYear();
      const mm   = String(now.getMonth() + 1).padStart(2, "0");
      const dd   = String(now.getDate()).padStart(2, "0");
      const hh   = String(now.getHours()).padStart(2, "0");
      const mi   = String(now.getMinutes()).padStart(2, "0");
      const ss   = String(now.getSeconds()).padStart(2, "0");

      elDate.textContent = `${yyyy}-${mm}-${dd}`;
      elWeek.textContent = weekNames[now.getDay()];
      elTime.textContent = `${hh}:${mi}`;
      elSec.textContent  = `:${ss}`;
    }

    tick();
    setInterval(tick, 1000);
  })();

  // 키패드
  (function initKeypad() {
    const root      = document.getElementById("checkin-kiosk");
    const inputEl   = document.getElementById("kiosk-id-input");
    const keypadEl  = document.getElementById("kiosk-keypad");
    const eraseBtn  = document.getElementById("btn-erase");
    const submitBtn = document.getElementById("btn-submit");
    const msgEl     = document.getElementById("kiosk-message");
    const MAX_LEN = 10;

    keypadEl.addEventListener("click", (e) => {
      const key = e.target.getAttribute("data-key");
      if (!key) return;
      if (key === "back") {
        inputEl.value = inputEl.value.slice(0, -1);
        msgEl.textContent = "";
        return;
      }
      if (inputEl.value.length >= MAX_LEN) return;
      inputEl.value += key;
      msgEl.textContent = "";
    });

    eraseBtn.addEventListener("click", () => {
      inputEl.value = "";
      msgEl.textContent = "";
    });

    submitBtn.addEventListener("click", () => {
      const id = inputEl.value.trim();
      if (!id) {
        msgEl.textContent = "ID를 입력하십시오.";
        return;
      }
      const event = new CustomEvent("checkin:submit", { detail: { id } });
      root.dispatchEvent(event);
      console.log("[CheckInMate] submit id:", id);
      inputEl.value = "";
      msgEl.textContent = "";
    });
  })();
</script>
</body>
</html>
