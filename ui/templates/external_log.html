<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>출석 로그 조회</title>
  <style>
    :root{
      --bg:#ffffff;
      --fg:#111;
      --muted:#666;
      --line:#e6e6e6;
      --card:#fff;
      --soft:#f6f7f9;
      --ok:#1b5e20;
      --warn:#8a6d00;
      --bad:#b00020;
      --primary:#1f4bd8;
      --radius:16px;
    }
    *{box-sizing:border-box}
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;margin:0;background:var(--bg);color:var(--fg)}
    .wrap{max-width:720px;margin:0 auto;padding:18px}
    h1{margin:6px 0 14px;font-size:26px;letter-spacing:-0.2px}
    .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    input{padding:12px 12px;font-size:16px;width:160px;border:1px solid var(--line);border-radius:12px}
    button{padding:10px 14px;font-size:16px;cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:12px}
    button:disabled{opacity:.6;cursor:not-allowed}
    .status{margin-top:10px;white-space:pre-wrap}
    .muted{color:var(--muted)}
    .error{color:var(--bad)}
    .ok{color:var(--ok)}

    .meta{margin-top:14px;padding:14px;border:1px solid var(--line);border-radius:var(--radius);background:var(--card)}
    .meta strong{font-size:18px}

    .section{margin-top:14px;padding:14px;border:1px solid var(--line);border-radius:var(--radius);background:var(--card)}
    .section h2{margin:0 0 10px;font-size:18px}
    .divider{height:1px;background:var(--line);margin:12px 0}

    /* Weekly donut */
    .weekly{display:flex;gap:14px;align-items:center}
    .donut{width:108px;height:108px;flex:0 0 auto}
    .weekly .numbers{display:flex;flex-direction:column;gap:6px}
    .pill{display:inline-flex;align-items:center;gap:8px;padding:8px 10px;background:var(--soft);border-radius:999px;color:var(--muted);font-size:13px}
    .big{font-size:22px;font-weight:800;letter-spacing:-0.2px}
    .small{font-size:13px;color:var(--muted)}

    /* Month summary grid */
    .month-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
    .month-nav{display:flex;align-items:center;gap:8px}
    .navbtn{padding:8px 10px;border-radius:12px;background:#fff}
    .month-title{font-weight:800}
    .legend{display:flex;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:12px}
    .legend span{display:inline-flex;align-items:center;gap:6px}
    .badge{width:18px;height:18px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;background:var(--soft);border:1px solid var(--line);font-weight:700}

    .grid{margin-top:10px;display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
    .cell{border:1px solid var(--line);border-radius:14px;padding:8px;background:#fff;min-height:58px}
    .cell .d{font-size:12px;color:var(--muted)}
    .cell .m{margin-top:6px;font-size:16px;font-weight:900}
    .cell.off{opacity:.35;background:var(--soft)}
    .markX{color:var(--bad)}
    .markT{color:var(--warn)}
    .markO{color:var(--ok)}
    .cell.today{border-color:var(--primary);box-shadow:0 0 0 2px rgba(31,75,216,.12)}

    /* Monthly detailed list */
    .day-card{margin-top:10px;padding:12px;border:1px solid var(--line);border-radius:14px;background:#fff}
    .day-title{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
    .day-title .date{font-weight:900}
    .day-title .dow{color:var(--muted);font-size:13px}
    .day-title .total{color:var(--muted);font-size:13px}
    .events{margin:0;padding-left:18px}
    .events li{margin:6px 0;font-size:14px}

    .tag{display:inline-block;padding:2px 8px;border:1px solid #ccc;border-radius:999px;font-size:12px;margin-left:8px;color:#333}
    .tag.start{border-color:#6aa84f}
    .tag.extend{border-color:#3c78d8}
    .tag.end{border-color:#cc0000}

    .btn-active-search{width:100%;margin-top:10px}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>출석 로그 조회</h1>

    <div class="row">
      <input id="kioskId" type="text" inputmode="numeric" placeholder="ID 입력" />
      <button id="btn">조회</button>
      <button id="clearBtn" type="button">지우기</button>
    </div>

    <div id="status" class="status muted">Kiosk ID를 입력하고 조회를 누르세요.</div>

    <button id="activeSearch" class="btn-active-search" onclick="location.href='/room'">재실 인원 조회</button>

    <div id="meta" class="meta" style="display:none;"></div>

    <!-- (1) Weekly -->
    <div id="weeklySection" class="section" style="display:none;">
      <h2>이번 주 활동 기록</h2>
      <div class="weekly">
        <svg class="donut" viewBox="0 0 120 120" aria-label="Weekly donut">
          <circle cx="60" cy="60" r="46" fill="none" stroke="#eaecef" stroke-width="14"></circle>
          <circle id="donutProg" cx="60" cy="60" r="46" fill="none" stroke="#1f4bd8" stroke-width="14"
                  stroke-linecap="round" transform="rotate(-90 60 60)"
                  stroke-dasharray="0 289" stroke-dashoffset="0"></circle>
          <text id="donutPct" x="60" y="66" text-anchor="middle" font-size="22" font-weight="800" fill="#111">0%</text>
        </svg>
        <div class="numbers">
          <div class="big"><span id="weeklyHours">0시간</span> <span class="small">(목표 <span id="weeklyGoal">0시간</span>)</span></div>
          <div class="pill">기간: <span id="weeklyRange"></span></div>
          <div class="pill">이번 주 출근일: <span id="weeklyDays"></span>일</div>
        </div>
      </div>
    </div>

    <!-- (2) Monthly summary -->
    <div id="monthSummarySection" class="section" style="display:none;">
      <div class="month-head">
        <h2 style="margin:0;">이번 달 출근 내역</h2>
        <div class="month-nav">
          <button class="navbtn" id="prevMonthBtn">←</button>
          <div class="month-title" id="monthLabel"></div>
          <button class="navbtn" id="nextMonthBtn">→</button>
        </div>
      </div>
      <div class="legend" style="margin-top:10px;">
        <span><span class="badge markX">X</span> 30분 미만</span>
        <span><span class="badge markT">▲</span> 3시간 미만</span>
        <span><span class="badge markO">O</span> 3시간 이상 (주말 30분 이상)</span>
      </div>
      <div class="divider"></div>
      <div class="grid" id="monthGrid"></div>
    </div>

    <!-- (3) Monthly detailed -->
    <div id="monthDetailSection" class="section" style="display:none;">
      <div class="month-head">
        <h2 style="margin:0;">출근 기록 (월별)</h2>
        <div class="month-nav">
          <button class="navbtn" id="prevMonthBtn2">←</button>
          <div class="month-title" id="monthLabel2"></div>
          <button class="navbtn" id="nextMonthBtn2">→</button>
        </div>
      </div>
      <div class="divider"></div>
      <div id="monthLogs"></div>
    </div>
  </div>

  <script>
    // API
    const API_PATH = "/attendance/logs"; // GET /attendance/logs?kioskId=1129

    // 주간 목표(원하시는 값으로 바꾸면 됨)
    const WEEKLY_GOAL_HOURS = 30;

    const kioskIdEl = document.getElementById("kioskId");
    const btnEl = document.getElementById("btn");
    const clearBtnEl = document.getElementById("clearBtn");
    const statusEl = document.getElementById("status");
    const metaEl = document.getElementById("meta");

    const weeklySectionEl = document.getElementById("weeklySection");
    const monthSummarySectionEl = document.getElementById("monthSummarySection");
    const monthDetailSectionEl = document.getElementById("monthDetailSection");

    const donutProgEl = document.getElementById("donutProg");
    const donutPctEl = document.getElementById("donutPct");
    const weeklyHoursEl = document.getElementById("weeklyHours");
    const weeklyGoalEl = document.getElementById("weeklyGoal");
    const weeklyRangeEl = document.getElementById("weeklyRange");
    const weeklyDaysEl = document.getElementById("weeklyDays");

    const monthLabelEl = document.getElementById("monthLabel");
    const monthLabel2El = document.getElementById("monthLabel2");
    const monthGridEl = document.getElementById("monthGrid");
    const monthLogsEl = document.getElementById("monthLogs");

    const prevMonthBtn = document.getElementById("prevMonthBtn");
    const nextMonthBtn = document.getElementById("nextMonthBtn");
    const prevMonthBtn2 = document.getElementById("prevMonthBtn2");
    const nextMonthBtn2 = document.getElementById("nextMonthBtn2");

    let _rawData = null;
    let _selectedMonth = null; // {y, m} m:1-12

    function setStatus(msg, cls) {
      statusEl.className = `status ${cls || "muted"}`;
      statusEl.textContent = msg;
    }

    function clearView() {
      _rawData = null;
      _selectedMonth = null;
      metaEl.style.display = "none";
      metaEl.innerHTML = "";
      weeklySectionEl.style.display = "none";
      monthSummarySectionEl.style.display = "none";
      monthDetailSectionEl.style.display = "none";
      monthGridEl.innerHTML = "";
      monthLogsEl.innerHTML = "";
      setStatus("kioskId를 입력하고 조회를 누르세요.", "muted");
    }

    function isNaturalNumber(v) {
      const n = Number(v);
      return Number.isInteger(n) && n > 0;
    }

    function escapeHtml(str) {
      return String(str)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function typeTag(type) {
      const t = (type || "").toLowerCase();
      const safe = escapeHtml(t || "unknown");
      const cls = (t === "start" || t === "extend" || t === "end") ? t : "";
      return `<span class="tag ${cls}">${safe}</span>`;
    }

    function parseYMD(ymd) {
      // ymd: "2026-01-02"
      const [y, m, d] = String(ymd).split("-").map(Number);
      return { y, m, d };
    }

    function pad2(n){ return String(n).padStart(2,"0"); }

    function toMinutes(hhmmss){
      // "20:56:32" -> minutes since 00:00 (floor to minute)
      const [hh, mm, ss] = String(hhmmss).split(":").map(Number);
      return (hh*60 + mm) + ((ss||0) >= 30 ? 1 : 0); // 반올림(대략)
    }

    function minutesToHm(mins){
      const h = Math.floor(mins/60);
      const m = mins%60;
      if(h<=0) return `${m}분`;
      if(m===0) return `${h}시간`;
      return `${h}시간 ${m}분`;
    }

    function computeDayTotalMinutes(day) {
      // day: {date, events:[{time,type}]}
      const events = Array.isArray(day.events) ? [...day.events] : [];
      if(events.length === 0) return 0;

      // 시간 오름차순
      events.sort((a,b)=>String(a.time).localeCompare(String(b.time)));

      let total = 0;
      let curStart = null;
      let lastSeen = null;

      for(const ev of events){
        const t = toMinutes(ev.time ?? "00:00:00");
        const type = (ev.type ?? "").toLowerCase();

        if(type === "start"){
          // start가 연속으로 오면 이전 세션은 마지막 seen 기준으로 닫음
          if(curStart !== null && lastSeen !== null && lastSeen >= curStart){
            total += (lastSeen - curStart);
          }
          curStart = t;
          lastSeen = t;
          continue;
        }

        if(type === "extend"){
          if(curStart !== null){
            lastSeen = t;
          }
          continue;
        }

        if(type === "end"){
          if(curStart !== null){
            const endT = t;
            if(endT >= curStart) total += (endT - curStart);
            curStart = null;
            lastSeen = null;
          }
          continue;
        }

        // unknown type: 세션 중이면 lastSeen만 갱신
        if(curStart !== null) lastSeen = t;
      }

      // end가 없으면 마지막 extend/이벤트 시간으로 종료 처리
      if(curStart !== null && lastSeen !== null && lastSeen >= curStart){
        total += (lastSeen - curStart);
      }

      // 비정상(음수) 방지
      if(!Number.isFinite(total) || total < 0) return 0;
      return total;
    }

    function getTodayYMD() {
      const now = new Date();
      return { y: now.getFullYear(), m: now.getMonth()+1, d: now.getDate() };
    }

    function ymdToDateLocal(ymd){
      // "YYYY-MM-DD" -> local date
      const {y,m,d} = parseYMD(ymd);
      return new Date(y, m-1, d);
    }

    function startOfWeekMonday(dateObj){
      // local 기준 월요일 시작
      const d = new Date(dateObj.getFullYear(), dateObj.getMonth(), dateObj.getDate());
      const day = d.getDay(); // 0=Sun
      const diff = (day === 0 ? -6 : 1 - day); // Monday
      d.setDate(d.getDate() + diff);
      d.setHours(0,0,0,0);
      return d;
    }

    function endOfWeekSunday(dateObj){
      const s = startOfWeekMonday(dateObj);
      const e = new Date(s);
      e.setDate(e.getDate() + 6);
      e.setHours(23,59,59,999);
      return e;
    }

    function inRange(dateObj, start, end){
      return dateObj.getTime() >= start.getTime() && dateObj.getTime() <= end.getTime();
    }

    function renderMeta(data){
      metaEl.style.display = "block";
      metaEl.innerHTML = `
        <div><strong>${escapeHtml(data.userName ?? "")}</strong></div>
        <div class="muted">userId: ${escapeHtml(data.userId ?? "")}</div>
      `;
    }

    function setSelectedMonth(y, m){
      _selectedMonth = { y, m };
      renderAll();
    }

    function addMonth(delta) {
      if (!_selectedMonth) return;

      const { y, m } = _selectedMonth;
      const base = new Date(y, m - 1, 1);
      base.setMonth(base.getMonth() + delta);

      // 상태만 바꾸는 게 아니라 서버에 새로 요청함 - 변경된 연/월로 재호출
      onSearch(base.getFullYear(), base.getMonth() + 1);
    }

    function buildDayMap(logData){
      // Map "YYYY-MM-DD" -> { dayObj, minutes }
      const map = new Map();
      for(const d of logData){
        const date = d.date;
        if(!date) continue;
        const mins = computeDayTotalMinutes(d);
        map.set(date, { raw:d, minutes: mins });
      }
      return map;
    }

    function renderWeekly(logData){
      const now = new Date();
      const ws = startOfWeekMonday(now);
      const we = endOfWeekSunday(now);

      const dayMap = buildDayMap(logData);

      let totalMin = 0;
      let activeDays = 0;

      // 주간: 월~일 7일을 순회(누락일도 0 처리)
      const iter = new Date(ws);
      for(let i=0;i<7;i++){
        const y = iter.getFullYear();
        const m = iter.getMonth()+1;
        const d = iter.getDate();
        const key = `${y}-${pad2(m)}-${pad2(d)}`;
        const rec = dayMap.get(key);
        const mins = rec ? rec.minutes : 0;
        totalMin += mins;
        if(mins > 0) activeDays += 1;
        iter.setDate(iter.getDate()+1);
      }

      const goalMin = WEEKLY_GOAL_HOURS * 60;
      const pct = goalMin <= 0 ? 0 : Math.max(0, Math.min(100, Math.round((totalMin/goalMin)*100)));

      // Donut stroke
      const r = 46;
      const C = 2 * Math.PI * r; // about 289
      const dash = (C * (pct/100));
      donutProgEl.setAttribute("stroke-dasharray", `${dash} ${C}`);
      donutPctEl.textContent = `${pct}%`;

      weeklyHoursEl.textContent = minutesToHm(totalMin);
      weeklyGoalEl.textContent = `${WEEKLY_GOAL_HOURS}시간`;

      const rangeText = `${ws.getFullYear()}-${pad2(ws.getMonth()+1)}-${pad2(ws.getDate())} ~ ${we.getFullYear()}-${pad2(we.getMonth()+1)}-${pad2(we.getDate())}`;
      weeklyRangeEl.textContent = rangeText;
      weeklyDaysEl.textContent = String(activeDays);

      weeklySectionEl.style.display = "block";
    }

    function markForMinutes(mins){
      if(mins < 30) return { ch:"X", cls:"markX" };
      if(mins < 180) return { ch:"▲", cls:"markT" };
      return { ch:"O", cls:"markO" };
    }

    function renderMonthSummary(logData){
      const {y,m} = _selectedMonth;
      monthLabelEl.textContent = `${y}년 ${pad2(m)}월`;
      monthLabel2El.textContent = `${y}년 ${pad2(m)}월`;

      const dayMap = buildDayMap(logData);

      // 달력 그리드(월요일 시작)
      const first = new Date(y, m-1, 1);
      const last = new Date(y, m, 0); // last day
      const firstDow = first.getDay(); // 0 Sun
      const offset = firstDow; // Sunday=0

      const daysInMonth = last.getDate();
      const totalCells = Math.ceil((offset + daysInMonth) / 7) * 7;

      monthGridEl.innerHTML = "";

      const today = getTodayYMD();

      for(let i=0;i<totalCells;i++){
        const cell = document.createElement("div");
        cell.className = "cell";

        const dayNum = i - offset + 1;
        if(dayNum < 1 || dayNum > daysInMonth){
          cell.classList.add("off");
          cell.innerHTML = `<div class="d">&nbsp;</div><div class="m">&nbsp;</div>`;
          monthGridEl.appendChild(cell);
          continue;
        }

        const cellDate = new Date(y, m-1, dayNum);
        cellDate.setHours(0,0,0,0);

        const now = new Date();
        now.setHours(0,0,0,0);

        const isFuture = cellDate.getTime() > now.getTime();
        const dayOfWeek = cellDate.getDay(); // 0=Sun, 6=Sat
        const isWeekend = (dayOfWeek === 0 || dayOfWeek === 6);


        let markHtml = "";
        if (!isFuture) {
          const key = `${y}-${pad2(m)}-${pad2(dayNum)}`;
          const rec = dayMap.get(key);
          const mins = rec ? rec.minutes : 0;

          if (isWeekend) {
            // 주말: 기록 없으면 '-', 30분 이상이면 'O'
            if (mins >= 30) {
              markHtml = `<div class="m markO">O</div>`;
            } else {
              markHtml = `<div class="m muted">-</div>`;
            }
          } else {
            // 평일: 기존 규칙 유지(X/△/O)
            const mk = markForMinutes(mins);
            markHtml = `<div class="m ${mk.cls}">${mk.ch}</div>`;
          }
        } else {
          // 미래 날짜는 표시 없음
          markHtml = `<div class="m muted">&nbsp;</div>`;
        }

        cell.innerHTML = `
          <div class="d">${dayNum}일</div>
          ${markHtml}
        `;

        monthGridEl.appendChild(cell);
      }

      monthSummarySectionEl.style.display = "block";
    }

    function renderMonthDetail(logData){
      const {y,m} = _selectedMonth;

      // 선택 월 데이터만 필터
      const filtered = (Array.isArray(logData) ? logData : [])
        .filter(d => {
          const p = parseYMD(d.date ?? "0000-00-00");
          return p.y === y && p.m === m;
        });

      // 최근 날짜가 위로 오도록 내림차순
      filtered.sort((a,b)=>String(b.date).localeCompare(String(a.date)));

      monthLogsEl.innerHTML = "";

      if(filtered.length === 0){
        monthLogsEl.innerHTML = `<div class="muted">선택한 월에 출근 기록이 없습니다.</div>`;
        monthDetailSectionEl.style.display = "block";
        return;
      }

      for(const day of filtered){
        const date = day.date ?? "";
        const dow = (day.day ?? "").toLowerCase();
        const events = Array.isArray(day.events) ? [...day.events] : [];

        // 이벤트는 시간 오름차순(읽기 쉬움)
        events.sort((a,b)=>String(a.time).localeCompare(String(b.time)));

        const totalMin = computeDayTotalMinutes(day);
        const totalTxt = totalMin > 0 ? minutesToHm(totalMin) : "0분";

        const card = document.createElement("div");
        card.className = "day-card";

        const title = document.createElement("div");
        title.className = "day-title";
        title.innerHTML = `
          <div>
            <span class="date">${escapeHtml(date)}</span>
            <span class="dow"> ${escapeHtml(dow)}</span>
          </div>
          <div class="total">총 ${escapeHtml(totalTxt)}</div>
        `;
        card.appendChild(title);

        if(events.length === 0){
          const empty = document.createElement("div");
          empty.className = "muted";
          empty.textContent = "이 날짜에 이벤트가 없습니다.";
          card.appendChild(empty);
        }else{
          const ul = document.createElement("ul");
          ul.className = "events";
          for(const ev of events){
            const li = document.createElement("li");
            const time = ev.time ?? "";
            const device = ev.source ?? "";
            const type = ev.type ?? "";
            li.innerHTML = `${escapeHtml(time)}  (${escapeHtml(device)}) ${typeTag(type)}`;
            ul.appendChild(li);
          }
          card.appendChild(ul);
        }

        monthLogsEl.appendChild(card);
      }

      monthDetailSectionEl.style.display = "block";
    }

    function renderAll(){
      if(!_rawData) return;

      const logData = _rawData.logData;

      // 섹션 1~3 렌더
      renderWeekly(logData);
      renderMonthSummary(logData);
      renderMonthDetail(logData);

      // 네비 버튼 연결(중복 id로 한 번만 연결되도록 안전 처리)
      prevMonthBtn.onclick = () => addMonth(-1);
      nextMonthBtn.onclick = () => addMonth(1);
      prevMonthBtn2.onclick = () => addMonth(-1);
      nextMonthBtn2.onclick = () => addMonth(1);
    }

    function initSelectedMonthFromLogData(logData){
      // 기본 선택 월: 가장 최근 기록의 월. 없으면 현재 월.
      if(Array.isArray(logData) && logData.length > 0){
        const sorted = [...logData].sort((a,b)=>String(b.date).localeCompare(String(a.date)));
        const latest = sorted[0]?.date;
        if(latest){
          const {y,m} = parseYMD(latest);
          return {y,m};
        }
      }
      const t = getTodayYMD();
      return {y:t.y, m:t.m};
    }

    async function onSearch(targetY, targetM) {
      const kioskId = kioskIdEl.value.trim();

      if (!isNaturalNumber(kioskId)) {
        setStatus("kioskId는 숫자만 허용됩니다.", "error");
        return;
      }

      // targetY, targetM 인자가 없으면 오늘 날짜를 기준으로 함
      const now = new Date();
      const y = targetY || now.getFullYear();
      const m = targetM || now.getMonth() + 1;

      // [핵심] 3번 로직 통합: 해당 월 1일이 포함된 주의 월요일 찾기
      const firstDayOfMonth = new Date(y, m - 1, 1);
      const dayIdx = firstDayOfMonth.getDay(); // 0:일, 1:월 ...
      const diffToMonday = (dayIdx === 0 ? -6 : 1 - dayIdx); // 월요일까지의 차이 계산

      const startDt = new Date(y, m - 1, 1 + diffToMonday);
      const startDate = `${startDt.getFullYear()}-${pad2(startDt.getMonth() + 1)}-${pad2(startDt.getDate())}`;

      // 해당 월의 마지막 날 계산
      const lastDt = new Date(y, m, 0);
      const endDate = `${y}-${pad2(m)}-${pad2(lastDt.getDate())}`;

      btnEl.disabled = true;
      setStatus(`${y}년 ${m}월 데이터 요청 중...`, "muted");

      try {
        // 백엔드 API 호출 (수정된 start, end 파라미터 적용)
        const url = `${API_PATH}?kioskId=${encodeURIComponent(kioskId)}&start=${startDate}&end=${endDate}`;
        const res = await fetch(url, { method: "GET", headers: { "Accept": "application/json" } });

        if (!res.ok) {
          const text = await res.text();
          setStatus(`요청 실패: HTTP ${res.status}\n${text}`, "error");
          return;
        }

        const data = await res.json();
        if (!data || !Array.isArray(data.logData)) {
          setStatus("응답 형식이 올바르지 않습니다.", "error");
          return;
        }

        // 전역 상태 업데이트
        _rawData = data;
        _selectedMonth = { y, m };

        // UI 렌더링
        renderMeta(data);
        renderAll();

        setStatus(`${y}년 ${m}월 조회 성공: ${data.logData.length}일치 로그`, "ok");

      } catch (e) {
        setStatus(`네트워크 오류: ${String(e)}`, "error");
      } finally {
        btnEl.disabled = false;
      }
    }
